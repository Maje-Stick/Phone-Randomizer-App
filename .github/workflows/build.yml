name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Decode the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is missing." >&2
            exit 1
          fi
          # tr strips any newlines a text editor introduced while copying.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/signing.p12"
          if [ ! -s "$RUNNER_TEMP/signing.p12" ]; then
            echo "Keystore decoded to an empty file. The secret is probably truncated." >&2
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"

      - name: Build the debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: randomizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
